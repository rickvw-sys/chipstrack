function pkey(x){return [x.brand,x.variant,x.flavor,x.type,Math.round(x.size)].map(function(v){return String(v).trim().toLowerCase()}).join("|")}
function updateCheckin(id,f){
  if(!gate())return false;
  var p=D.posts.filter(function(x){return x.id===id})[0];if(!p||p.uid!==uid)return false;
  if(String(id).indexOf("tmp")===0){toast("Even wachten, je check-in wordt nog opgeslagen.");return false}
  var old=PR[p.pid],nk=pkey(f),changed=!old||pkey(old)!==nk,ex=null;
  if(changed){
    ex=D.products.filter(function(x){return pkey(x)===nk})[0];
    if(!ex){ex={id:"tmp"+nid(),code:"",brand:f.brand,variant:f.variant,flavor:f.flavor,type:f.type,size:f.size,uid:uid,ts:Date.now()};PR[ex.id]=ex;D.products.push(ex)}
    p.pid=ex.id;mkPost(p,ex);
  }
  p.taste=f.taste;p.tex=f.tex;p.rating=f.rating;p.img=f.img;p.text=f.text;render();
  qrun(async function(){
    var url=f.img||null;if(f.img&&f.img.indexOf("data:")===0)url=await upload(f.img,"chips");
    var upd={rating:f.rating,taste:f.taste,texture:f.tex,photo:url,review:f.text||null};
    if(changed){
      var pid=String(ex.id).indexOf("tmp")===0?null:ex.id;
      if(!pid){var r=await SB.rpc("upsert_product",{p_barcode:null,p_brand:f.brand,p_variant:f.variant,p_flavor:f.flavor,p_type:f.type,p_size:f.size});if(r.error)return r;pid=r.data}
      upd.product_id=pid;
    }
    return SB.from("checkins").update(upd).eq("id",id);
  });
  return true;
}
async function submitCheckin(f){
  if(!gate())return;
  var pr=f.pid?PR[f.pid]:null,hadCode=pr&&pr.code;
  if(!pr){pr={id:"tmp"+nid(),code:f.code||"",brand:f.brand,variant:f.variant,flavor:f.flavor,type:f.type,size:f.size,uid:uid,ts:Date.now()};PR[pr.id]=pr;D.products.push(pr)}
  D.posts.push(mkPost({id:"tmp"+nid(),uid:uid,pid:pr.id,taste:f.taste,tex:f.tex,rating:f.rating,img:f.img,text:f.text,ts:Date.now()},pr));
  render();
  qrun(async function(){
    var pid=f.pid;
    if(!pid||(f.code&&!hadCode)){
      var r=await SB.rpc("upsert_product",{p_barcode:f.code||null,p_brand:f.brand,p_variant:f.variant,p_flavor:f.flavor,p_type:f.type,p_size:f.size});
      if(r.error)return r;pid=r.data;
    }
    var url=null;if(f.img&&f.img.indexOf("data:")===0)url=await upload(f.img,"chips");
    return SB.from("checkins").insert({product_id:pid,rating:f.rating,taste:f.taste,texture:f.tex,photo:url,review:f.text||null});
  });
}

/* ---------- berekeningen ---------- */
function aggr(list){
  var n=list.length,s=0,t=0,x=0,tn=0,xn=0,img="";
  list.forEach(function(p){s+=p.rating;if(p.taste!=null){t+=p.taste;tn++}if(p.tex!=null){x+=p.tex;xn++}});
  list.slice().sort(function(a,b){return b.ts-a.ts}).some(function(p){var u=imgOk(p.img);if(u){img=u;return true}});
  return{n:n,avg:n?s/n:0,taste:tn?t/tn:null,tex:xn?x/xn:null,img:img};
}
function prodList(by,mine){
  var g={};D.posts.forEach(function(p){if(mine&&p.uid!==uid)return;(g[p.pid]=g[p.pid]||[]).push(p)});
  var out=[];keys(g).forEach(function(id){var pr=PR[id];if(!pr)return;var a=aggr(g[id]),v=by==="smaak"?a.taste:by==="tex"?a.tex:a.avg;if(v==null)return;out.push({p:pr,a:a,v:v})});
  return out.sort(function(x,y){return y.v-x.v||y.a.n-x.a.n});
}
function userRank(){
  var c={};D.posts.forEach(function(p){c[p.uid]=(c[p.uid]||0)+1});
  return keys(c).map(function(u){return{u:u,n:c[u]}}).sort(function(a,b){return b.n-a.n||uname(a.u).localeCompare(uname(b.u))});
}
function statusOf(n){for(var i=0;i<STATUS.length;i++)if(n>=STATUS[i][0])return STATUS[i];return STATUS[3]}
function filterActive(f){return !!f&&(f.min>0||f.max<5||f.from!=null||keys(f.brands).length>0||keys(f.flavors).length>0||f.sort!=="recent")}
function feedList(f,fd){
  var cnt={};D.posts.forEach(function(p){cnt[p.pid]=(cnt[p.pid]||0)+1});
  var l=D.posts.filter(function(p){
    if(fd==="fr"&&!following(p.uid))return false;
    if(f){
      if(p.rating<f.min||p.rating>f.max)return false;
      if(f.from!=null&&(p.ts<f.from||p.ts>f.to))return false;
      if(keys(f.brands).length&&!f.brands[p.brand.toLowerCase()])return false;
      if(keys(f.flavors).length&&!f.flavors[p.flavor.toLowerCase()])return false;
    }
    return true;
  });
  var s=f?f.sort:"recent";
  l.sort(function(a,b){if(s==="top")return b.rating-a.rating||b.ts-a.ts;if(s==="most")return cnt[b.pid]-cnt[a.pid]||b.ts-a.ts;return b.ts-a.ts});
  return l;
}

function filterModal(){

    var a=+$("r1").value,b=+$("r2").value;$("rf").style.left=(a/5*100)+"%";$("rf").style.width=((b-a)/5*100)+"%";$("rl1").textContent=a.toFixed(1);$("rl2").textContent=b.toFixed(1);

     +'<div class="card" style="margin-top:12px"><div class="name">Algemene beoordeling</div>'+dual("r",0,5,0.5,w.min,w.max)+'<div class="dlab"><span id="rl1"></span><span id="rl2"></span></div></div>'

     +'<div class="card"><div class="name" style="margin-bottom:8px">Sorteren op</div><div class="chips">'+[["recent","Meest recent"],["top","Hoogst beoordeeld"],["most","Meeste check-ins"]].map(function(s){return '<button class="chip'+(w.sort===s[0]?" on":"")+'" data-so="'+s[0]+'">'+s[1]+'</button>'}).join("")+'</div></div>'
     +'<button class="btn full" id="fok"></button></div></div>';

function b64u(s){var p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function pushOk(){return !CFG_MISSING&&location.protocol!=="file:"&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
async function pushSub(){var reg=await navigator.serviceWorker.ready;return {reg:reg,sub:await reg.pushManager.getSubscription()}}
async function pushOn(){
  var perm=Notification.permission==="granted"?"granted":await Notification.requestPermission();
  if(perm!=="granted")return "Meldingen zijn geblokkeerd. Zet ze aan in de instellingen van je telefoon of browser.";
  var x=await pushSub(),sub=x.sub||await x.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  var j=sub.toJSON(),r=await SB.rpc("save_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  return r.error?"Aanzetten mislukt: "+r.error.message:"";
}
async function pushOff(){var x=await pushSub();if(x.sub){try{await SB.rpc("drop_push",{p_endpoint:x.sub.endpoint})}catch(e){}await x.sub.unsubscribe()}}
function pushSync(){if(acct&&PSY!==uid&&pushOk()&&Notification.permission==="granted"){PSY=uid;pushOn().catch(function(){})}}
function pushBox(msg){
  var el=$("pushbox");if(!el||!acct)return;
  var ios="standalone" in navigator,sa=navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  if(!pushOk()){el.innerHTML=ios&&!sa?'<p class="meta">Pushmeldingen? Zet Chipstrack eerst op je beginscherm (deelmenu &gt; Zet op beginscherm) en open de app vanaf daar.</p>':"";return}
  pushSub().then(function(x){
    var on=!!x.sub&&Notification.permission==="granted";
    el.innerHTML='<div class="row" style="margin:10px 0 4px"><span class="grow"><b>Pushmeldingen</b><br><small class="meta">Bij likes en reacties op je check-ins</small></span><button class="btn ghost" id="pshb">'+(on?"Uitzetten":"Aanzetten")+'</button></div><p class="meta" id="pshm" role="status">'+esc(msg||"")+'</p>';
    $("pshb").onclick=async function(){this.disabled=true;var m="";try{if(on)await pushOff();else m=await pushOn()}catch(e){m="Er ging iets mis. Probeer het opnieuw."}pushBox(m)};
  });
}

function showGate(){var g=$("gate");if(S.gate==="app"){g.style.display="none";g.innerHTML="";pushSync();return}g.style.display="flex";g.innerHTML=gateHtml()}
async function authAct(a){
  S.gmsg="";
  try{
    if(a==="toauth"||a==="gback"){closeModal();S.gate="auth"}
    else if(a==="login")S.gate="login";
    else if(a==="create")S.gate="register";
    else if(a==="guest")S.gate="app";
    else if(a==="forgot")S.gate="forgot";
    else if(a==="doforgot"){
      var id2=val("em").trim();
      if(!id2)S.gmsg="Vul je gebruikersnaam of e-mailadres in.";
      else{
        var ml=id2;
        if(id2.indexOf("@")<0){var l2=await SB.rpc("email_for_login",{identifier:id2});ml=l2.data||""}
        if(ml){var rr=await SB.auth.resetPasswordForEmail(ml,{redirectTo:location.origin+location.pathname});
          if(rr.error&&/rate|seconds|limit/i.test(rr.error.message||"")){S.gmsg="Wacht even en probeer het over een minuut opnieuw.";showGate();render();return}}
        S.gate="login";S.gmsg="Als dit account bestaat, hebben we een e-mail gestuurd met een link om je wachtwoord te wijzigen."
      }
    }
    else if(a==="doreset"){
      if(val("pw").length<6)S.gmsg="Kies een wachtwoord van minstens 6 tekens.";
      else if(val("pw")!==val("pw2"))S.gmsg="De twee wachtwoorden zijn niet gelijk.";
      else{
        var ur=await SB.auth.updateUser({password:val("pw")});
        if(ur.error)S.gmsg=/same|different/i.test(ur.error.message||"")?"Kies een ander wachtwoord dan je huidige.":"Wijzigen mislukt: "+ur.error.message;
        else{RECOV=false;var ss=(await SB.auth.getSession()).data.session;if(ss){uid=ss.user.id;idok=true;await loadAll();S.gate="app";toast("Wachtwoord gewijzigd")}else{S.gate="login";S.gmsg="Wachtwoord gewijzigd. Log nu in."}}
      }
    }
    else if(a==="logout"){try{await pushOff()}catch(e){}PSY="";await SB.auth.signOut();idok=false;uid="lokaal";S.gate="auth";S.tab="feed";S.det=null}
    else if(a==="dologin"){
      var ident=val("em").trim(),mail=ident;
      if(ident&&ident.indexOf("@")<0){var lk=await SB.rpc("email_for_login",{identifier:ident});mail=lk.data||""}
      var r=mail?await SB.auth.signInWithPassword({email:mail,password:val("pw")}):{error:{message:""}};
      if(r.error)S.gmsg=/confirm/i.test(r.error.message||"")?"Bevestig eerst je e-mailadres via de mail die we je stuurden.":"Gebruikersnaam, e-mailadres of wachtwoord klopt niet.";
      else{uid=r.data.user.id;idok=true;await loadAll();S.gate="app"}
    }else if(a==="mk"){
      var n=val("un").trim();
      if(n.length<3||!/^[A-Za-z0-9_.-]+$/.test(n)||n.length>24)S.gmsg="Gebruikersnaam: 3 tot 24 tekens, letters, cijfers, _ . of -";
      else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("em").trim()))S.gmsg="Vul een geldig e-mailadres in.";
      else if(val("pw").length<6)S.gmsg="Kies een wachtwoord van minstens 6 tekens.";
      else if(D.profiles.some(function(q){return q.username.toLowerCase()===n.toLowerCase()}))S.gmsg="Deze gebruikersnaam is al bezet.";
      else{
        var r2=await SB.auth.signUp({email:val("em").trim(),password:val("pw"),options:{data:{username:n}}});
        if(r2.error){var m2=r2.error.message||"";S.gmsg=/already|registered/i.test(m2)?"Dit e-mailadres is al in gebruik. Log in of kies een ander adres.":/database/i.test(m2)?"Deze gebruikersnaam is al bezet.":"Account maken mislukt: "+m2}
        else if(r2.data.user&&r2.data.user.identities&&!r2.data.user.identities.length)S.gmsg="Dit e-mailadres is al in gebruik. Log in of kies een ander adres.";
        else if(!r2.data.session){S.gate="login";S.gmsg="Account gemaakt. Bevestig eerst je e-mail en log daarna in."}
        else{uid=r2.data.user.id;idok=true;await loadAll();S.gate="app"}
      }
    }
  }catch(e){S.gmsg="Er ging iets mis. Probeer het opnieuw."}
  showGate();render();
}
