land waar je woont. Optioneel: voor- en achternaam en profielfoto.":"username, email address, password (encrypted, we cannot read it) and the country where you live. Optional: first and last name and profile photo.","welke chips, je scores, eventuele foto en recensie en het tijdstip. Optioneel de plaatsnaam, als je locatie aanzet. Nooit je exacte positie.":"which chips, your scores, any photo and review, and the time. Optionally the place name, if you turn on your location. Never your exact position.","Activiteit:":"Activity:","likes, reacties, wie je volgt en wie jou volgt, en meldingen die je indient.":"likes, comments, who you follow and who follows you, and reports you submit.","Wishlist en lijsten:":"Wishlist and lists:","chips die je wilt proberen (alleen zichtbaar voor jou) en lijsten die je zelf maakt, met een naam en chips (zichtbaar voor ingelogde gebruikers van de app).":"chips you want to try (only visible to you) and lists you create yourself, with a name and chips (visible to logged-in users of the app).","Pushmeldingen:":"Push notifications:","alleen als je die aanzet, bewaren we een technisch adres van je apparaat om je meldingen te sturen.":"only if you turn them on, we keep a technical address of your device to send you notifications.","Wie kan wat zien?":"Who can see what?","Je gebruikersnaam, naam, profielfoto, land en je check-ins (met foto, recensie en plaatsnaam) zijn zichtbaar voor iedereen die de app opent, ook voor gasten zonder account. Je e-mailadres is alleen voor jou en de beheerder.":"Your username, name, profile photo, country and your check-ins (with photo, review and place name) are visible to everyone who opens the app, including guests without an account. Your email address is only for you and the administrator.","Waarvoor gebruiken we ze?":"What do we use it for?","Om de app te laten werken: inloggen, check-ins tonen, ranglijsten maken en meldingen sturen. We gebruiken je gegevens niet voor reclame en verkopen ze niet.":"To make the app work: logging in, showing check-ins, building leaderboards and sending notifications. We don't use your data for advertising and don't sell it.","Met welke partijen delen we gegevens?":"Who do we share data with?","database, inloggen en opslag van foto's.":"database, login and photo storage.","hosting van de app.":"hosting of the app.","Productgegevens (merk, variant, smaak en barcode) komen van Open Food Facts en vallen onder de ODbL-licentie. alleen als je bij nieuwe chips een barcode invult of scant, zoekt deze dienst de productgegevens erbij. De barcode wordt dan naar deze dienst gestuurd.":"Product data (brand, variant, flavour and barcode) comes from Open Food Facts and falls under the ODbL licence. Only if you enter or scan a barcode for new chips, this service looks up the product data. The barcode is then sent to this service.","alleen als je locatie gebruikt, zoekt deze dienst de plaatsnaam bij je positie.":"only if you use location, this service looks up the place name for your position.","Apple, Google of Mozilla:":"Apple, Google or Mozilla:","alleen bij pushmeldingen, voor het bezorgen van de melding.":"only for push notifications, to deliver the notification.","Toestemming":"Consent","Locatie en pushmeldingen gebruiken we alleen met jouw toestemming. Je kunt die altijd intrekken in de instellingen van je telefoon of browser, of in de app.":"We only use location and push notifications with your consent. You can withdraw it at any time in your phone or browser settings, or in the app.","Hoe lang bewaren we ze?":"How long do we keep it?","Zolang je account bestaat. Verwijder je je account, dan worden je profiel, check-ins, foto's, likes, reacties en pushgegevens verwijderd. Back-ups bij Supabase kunnen nog beperkte tijd bestaan.":"As long as your account exists. If you delete your account, your profile, check-ins, photos, likes, comments and push data are deleted. Backups at Supabase may still exist for a limited time.","Jouw rechten":"Your rights","Leeftijd":"Age","Chipstrack is voor mensen van 16 jaar en ouder.":"Chipstrack is for people aged 16 and over.","Opslag in je browser":"Storage in your browser","De app bewaart in je browser alleen je inlogsessie en een paar voorkeuren (zoals of je locatie standaard aan staat). Er zijn geen advertentie- of trackingcookies.":"The app only stores your login session and a few preferences in your browser (such as whether your location is on by default). There are no advertising or tracking cookies.","Gebruiksvoorwaarden Chipstrack":"Chipstrack terms of use","Door een account aan te maken of de app te gebruiken ga je akkoord met deze voorwaarden. Lees ook de privacyverklaring.":"By creating an account or using the app you agree to these terms. Please also read the privacy statement.","1. Wie mag de app gebruiken?":"1. Who may use the app?","Je moet 16 jaar of ouder zijn. Je geeft juiste gegevens op en houdt je wachtwoord geheim. Je bent zelf verantwoordelijk voor wat er met jouw account gebeurt.":"You must be 16 or older. You provide correct information and keep your password secret. You are responsible for what happens with your account.","2. Wat je plaatst":"2. What you post","Je check-ins, scores, recensies, reacties, foto's en profielgegevens blijven van jou. Door ze te plaatsen geef je Chipstrack toestemming om ze in de app te tonen aan andere gebruikers, voor zover jij ze deelt, en om ze op te slaan zodat de app werkt. Deze toestemming stopt wanneer je de inhoud of je account verwijdert. Plaats alleen foto's die je zelf hebt gemaakt of mag gebruiken, en geen foto's waarop anderen herkenbaar zijn zonder hun toestemming.":"Your check-ins, scores, reviews, comments, photos and profile details remain yours. By posting them you give Chipstrack permission to show them in the app to other users, as far as you share them, and to store them so the app works. This permission ends when you delete the content or your account. Only post photos that you took yourself or may use, and no photos in which others are recognisable without their consent.","3. Wat niet mag":"3. What is not allowed","Beledigende, discriminerende, bedreigende of seksueel getinte inhoud.":"Offensive, discriminatory, threatening or sexually suggestive content.","Pesten, lastigvallen of doen alsof je iemand anders bent.":"Bullying, harassing or pretending to be someone else.","Reclame, spam of misleidende beoordelingen, bijvoorbeeld namens een merk.":"Advertising, spam or misleading ratings, for example on behalf of a brand.","Inhoud die in strijd is met de wet of met rechten van anderen, zoals auteursrechten.":"Content that violates the law or the rights of others, such as copyright.","Het verstoren of misbruiken van de app of het ophalen van gegevens van andere gebruikers.":"Disrupting or abusing the app or harvesting data of other users.","4. Toezicht en maatregelen":"4. Oversight and measures","Je kunt inhoud melden met de vlag-knop. De beheerders mogen inhoud verwijderen die tegen deze voorwaarden is, en accounts waarschuwen, tijdelijk blokkeren of verwijderen als dat nodig is. Bij ernstige overtredingen kan dat zonder voorafgaande melding.":"You can report content with the flag button. The administrators may remove content that violates these terms, and warn, temporarily block or delete accounts if necessary. In case of serious violations this can happen without prior notice.","5. Beoordelingen en gegevens over chips":"5. Ratings and data about chips","Scores en recensies zijn de persoonlijke mening van gebruikers. Productgegevens worden door gebruikers toegevoegd en kunnen onjuist of verouderd zijn. Chipstrack is niet verbonden aan de merken in de app. Merknamen en logo's zijn van hun eigenaren.":"Scores and reviews are users' personal opinions. Product data is added by users and may be incorrect or outdated. Chipstrack is not affiliated with the brands in the app. Brand names and logos belong to their owners.","6. Eigendom van Chipstrack":"6. Ownership of Chipstrack","De app, het ontwerp, de naam en het logo van Chipstrack zijn eigendom van Chipstrack. Je mag ze niet kopiëren of voor andere doeleinden gebruiken zonder toestemming.":"The app, the design, the name and the logo of Chipstrack are owned by Chipstrack. You may not copy them or use them for other purposes without permission.","7. Beschikbaarheid":"7. Availability","We doen ons best om de app goed te laten werken, maar kunnen niet garanderen dat hij altijd beschikbaar of foutloos is. Chipstrack is nog in ontwikkeling: functies kunnen veranderen of verdwijnen.":"We do our best to keep the app working well, but cannot guarantee that it is always available or error-free. Chipstrack is still in development: features may change or disappear.","8. Aansprakelijkheid":"8. Liability","Je gebruikt de app op eigen risico. Chipstrack is niet aansprakelijk voor schade door het gebruik van de app of door inhoud van gebruikers, behalve bij opzet of grove schuld of als de wet iets anders voorschrijft. Chipstrack geeft geen voedings- of allergie-informatie: lees altijd de verpakking.":"You use the app at your own risk. Chipstrack is not liable for damage resulting from use of the app or from user content, except in case of intent or gross negligence or where the law provides otherwise. Chipstrack does not provide nutrition or allergy information: always read the packaging.","9. Stoppen":"9. Stopping","Vragen, een melding of een verzoek? Mail naar":"Questions, a report or a request? Email","11. Wijzigingen en toepasselijk recht":"11. Changes and applicable law","We kunnen deze voorwaarden aanpassen. Bij belangrijke wijzigingen laten we dat in de app weten. Blijf je de app gebruiken, dan ga je akkoord met de nieuwe versie. Nederlands recht is van toepassing.":"We may change these terms. For important changes we will let you know in the app. If you keep using the app, you agree to the new version. Dutch law applies.","Voorwaarden":"Terms","Opslaan mislukt. Probeer het opnieuw.":"S <script>
/* Chipstrack like-animatie: chips-icoon + twee chips die proosten en in stukjes vallen.

(function(){

function poly(a,b,rot,n,wave,ph){var p=[],c=Math.cos(rot),s=Math.sin(rot);

      // kruimeltjes
      for(var i=0;i<12;i++){var a=rnd(i+s*20)*6.283,vv=2+rnd(i+5)*4,cx=x+Math.cos(a)*K*vv*.8*fall+d*K*.6*fall,cy=y+Math.sin(a)*K*vv*.7*fall-K*2*fall+.5*K*19*fall*fall,al2=Math.max(0,Math.min(1,(1.6-t)/.4));
        if(al2>0){ctx.globalAlpha=al2;ctx.fillStyle=i%3?GOLD2:"#c98700";ctx.beginPath();ctx.arc(cx,cy,K*(.04+rnd(i+9)*.06),0,7);ctx.fill();ctx.globalAlpha=1}}
    }
  }

  if(t>.6&&t<.9){var q=(t-.6)/.3,ex=mx,ey=my-K*.7;
    ctx.save();ctx.translate(ex,ey);ctx.globalAlpha=Math.max(0,1-q*1.1);ctx.strokeStyle=INK;ctx.lineWidth=K*.1;ctx.lineCap="round";

    st(0);ctx.restore()}
  ctx.restore();
}

})();

  var old=D[col].filter(function(x){return x.id===id})[0];
  D[col]=D[col].filter(function(x){return x.id!==id});render();
  if(!old)return;
  if(col==="posts")qrun(function(){return SB.from("checkins").delete().eq("id",id)});
  else if(col==="likes")qrun(function(){return SB.from("likes").delete().eq("checkin_id",old.post).eq("user_id",uid)});
  else if(col==="follows")qrun(function(){return SB.from("follows").delete().eq("follower_id",uid).eq("followed_id",old.to)});
}
function gate(){setAcct();if(!acct){toast("Maak een account of log in om mee te doen");return false}return true}
function setAcct(){acct=idok&&!!PM[uid]}
function likeCount(id){return D.likes.filter(function(x){return x.post===id}).length}
function liked(id){return D.likes.some(function(x){return x.id===safe(id+"_"+uid)})}
function cms(id){return D.comments.filter(function(x){return x.post===id}).sort(function(a,b){return a.ts-b.ts})}
function following(u){return D.follows.some(function(f){return f.id===safe(uid+"_"+u)})}
function toggleFollow(u){if(!gate()||u===uid)return;var id=safe(uid+"_"+u);if(following(u))del("follows",id);else put("follows",id,{from:uid,to:u})}

function pkey(x){return [x.brand,x.variant,x.flavor,x.type,Math.round(x.size)].map(function(v){return String(v).trim().toLowerCase()}).join("|")}
function updateCheckin(id,f){
  if(!gate())return false;
  var p=D.posts.filter(function(x){return x.id===id})[0];if(!p||(p.uid!==uid&&!isMod()))return false;
  if(String(id).indexOf("tmp")===0){toast("Even wachten, je check-in wordt nog opgeslagen.");return false}
  var old=PR[p.pid],nk=pkey(f),changed=!old||pkey(old)!==nk,ex=null;
  if(changed){
    ex=D.products.filter(function(x){return pkey(x)===nk})[0];
    if(!ex){ex={id:"tmp"+nid(),code:"",brand:f.brand,variant:f.variant,flavor:f.flavor,type:f.type,size:f.size,uid:uid,ts:Date.now()};PR[ex.id]=ex;D.products.push(ex)}
    p.pid=ex.id;mkPost(p,ex);
  }
  p.taste=f.taste;p.tex=f.tex;p.rating=f.rating;p.img=f.img;p.text=f.text;p.place=f.place||"";
  var tAdd=[],tDel=[];
  if(f.tags){tAdd=f.tags.filter(function(u){return f.tags0.indexOf(u)<0});tDel=f.tags0.filter(function(u){return f.tags.indexOf(u)<0});
    D.tags=D.tags.filter(function(x){return !(x.post===id&&tDel.indexOf(x.uid)>=0)});tAdd.forEach(function(u){D.tags.push({id:safe(id+"_"+u),post:id,uid:u,ts:Date.now()})})}
  render();
  qrun(async function(){
    var url=f.img||null;if(f.img&&f.img.indexOf("data:")===0)url=await upload(f.img,"chips");
    var upd={rating:f.rating,taste:f.taste,texture:f.tex,photo:url,review:f.text||null,place:f.place||null};
    if(changed){
      var pid=String(ex.id).indexOf("tmp")===0?null:ex.id;
      if(!pid){var r=await SB.rpc("upsert_product",{p_barcode:null,p_brand:f.brand,p_variant:f.variant,p_flavor:f.flavor,p_type:f.type,p_size:f.size});if(r.error)return r;pid=r.data}
      upd.product_id=pid;
    }
    var ur=await SB.from("checkins").update(upd).eq("id",id);if(ur.error)return ur;
    if(tDel.length){var dr=await SB.from("checkin_tags").delete().eq("checkin_id",id).in("tagged_user_id",tDel);if(dr.error)return dr}
    if(tAdd.length)return SB.from("checkin_tags").insert(tAdd.map(function(u){return{checkin_id:id,tagged_user_id:u}}));
    return ur;
  });
  return true;
}
async function submitCheckin(f){
  if(!gate())return;
  var pr=f.pid?PR[f.pid]:null,hadCode=pr&&pr.code;
  if(f.code&&pr&&!pr.code)pr.code=f.code;
  if(!pr){pr={id:"tmp"+nid(),code:f.code||"",brand:f.brand,variant:f.variant,flavor:f.flavor,type:f.type,size:f.size,uid:uid,ts:Date.now()};PR[pr.id]=pr;D.products.push(pr)}
  var tmpId="tmp"+nid();(f.tags||[]).forEach(function(u){D.tags.push({id:safe(tmpId+"_"+u),post:tmpId,uid:u,ts:Date.now()})});
  D.posts.push(mkPost({id:tmpId,uid:uid,pid:pr.id,taste:f.taste,tex:f.tex,rating:f.rating,img:f.img,text:f.text,place:f.place||"",ts:Date.now()},pr));
  render();
  qrun(async function(){
    var pid=f.pid;
    if(!pid||(f.code&&!hadCode)){
      var r=await SB.rpc("upsert_product",{p_barcode:f.code||null,p_brand:f.brand,p_variant:f.variant,p_flavor:f.flavor,p_type:f.type,p_size:f.size});
      if(r.error)return r;pid=r.data;
    }
    var url=f.img&&f.img.indexOf("data:")!==0?f.img:null;if(f.img&&f.img.indexOf("data:")===0)url=await upload(f.img,"chips");
    if(f.img&&f.img.indexOf("data:")===0&&!url)toast("Foto uploaden lukt niet. Je check-in is wel opgeslagen. Voeg de foto later toe via Bewerken.");
    var cr=await SB.from("checkins").insert({product_id:pid,rating:f.rating,taste:f.taste,texture:f.tex,photo:url,review:f.text||null,place:f.place||null}).select("id").single();
    if(cr.error||!f.tags||!f.tags.length)return cr;
    return SB.from("checkin_tags").insert(f.tags.map(function(u){return{checkin_id:cr.data.id,tagged_user_id:u}}));
  });
}
async function saveProfile(first,last,avatarData,country){
  var p=PM[uid];if(!p)return;
  p.first=first;p.last=last;p.country=country||"";if(avatarData)p.avatar=avatarData;render();
  qrun(async function(){
    var url=PM[uid].avatar;
    if(avatarData&&avatarData.indexOf("data:")===0)url=await upload(avatarData,"avatar")||"";
    return SB.from("profiles").update({first_name:first||null,last_name:last||null,avatar_url:url||null,country:country||null}).eq("id",uid);
  });
}

/* ---------- berekeningen ---------- */
function aggr(list,pr){
  var n=list.length,s=0,t=0,x=0,tn=0,xn=0,img="";
  list.forEach(function(p){s+=p.rating;if(p.taste!=null){t+=p.taste;tn++}if(p.tex!=null){x+=p.tex;xn++}});
  list.slice().sort(function(a,b){return b.ts-a.ts}).some(function(p){var u=imgOk(p.img);if(u){img=u;return true}});
  if(!img){var q0=pr||(list[0]&&PR[list[0].pid]);if(q0)img=imgOk(q0.photo)}
  return{n:n,avg:n?s/n:0,taste:tn?t/tn:null,tex:xn?x/xn:null,img:img};
}
function prodList(by,mine){
  var g={};D.posts.forEach(function(p){if(mine&&p.uid!==uid)return;(g[p.pid]=g[p.pid]||[]).push(p)});
  var out=[];keys(g).forEach(function(id){var pr=PR[id];if(!pr)return;var a=aggr(g[id],pr),v=by==="smaak"?a.taste:by==="tex"?a.tex:a.avg;if(v==null)return;out.push({p:pr,a:a,v:v})});
  return out.sort(function(x,y){return y.v-x.v||y.a.n-x.a.n});
}
function userRank(){
  var c={};D.posts.forEach(function(p){c[p.uid]=(c[p.uid]||0)+1});
  return keys(c).map(function(u){return{u:u,n:c[u]}}).sort(function(a,b){return b.n-a.n||uname(a.u).localeCompare(uname(b.u))});
}
function statusOf(n){for(var i=0;i<STATUS.length;i++)if(n>=STATUS[i][0])return STATUS[i];return STATUS[3]}
function filterActive(f){return !!f&&(f.min>0||f.max<5||f.from!=null||keys(f.brands).length>0||keys(f.flavors).length>0||f.sort!=="recent")}
function feedList(f,fd){
  var cnt={};D.posts.forEach(function(p){cnt[p.pid]=(cnt[p.pid]||0)+1});
  var l=D.posts.filter(function(p){
    if(fd==="fr"&&!following(p.uid))return false;
    if(f){
      if(p.rating<f.min||p.rating>f.max)return false;
      if(f.from!=null&&(p.ts<f.from||p.ts>f.to))return false;
      if(keys(f.brands).length&&!f.brands[p.brand.toLowerCase()])return false;
      if(keys(f.flavors).length&&!f.flavors[p.flavor.toLowerCase()])return false;
    }
    return true;
  });
  var s=f?f.sort:"recent";
  l.sort(function(a,b){if(s==="top")return b.rating-a.rating||b.ts-a.ts;if(s==="most")return cnt[b.pid]-cnt[a.pid]||b.ts-a.ts;return b.ts-a.ts});
  return l;
}

function weekly(){
  var cut=Date.now()-6048e5,w=D.posts.filter(function(p){return p.ts>=cut});if(!w.length)return "";
  var g={},us={},best=null,top=null;
  w.forEach(function(p){(g[p.pid]=g[p.pid]||[]).push(p);us[p.uid]=(us[p.uid]||0)+1});
  keys(g).forEach(function(id){var a=aggr(g[id],PR[id]);if(!PR[id])return;if(!best||a.n>best.a.n||(a.n===best.a.n&&a.avg>best.a.avg))best={p:PR[id],a:a}});
  keys(us).forEach(function(u){if(!top||us[u]>top.n)top={u:u,n:us[u]}});
  return '<div class="card wk"><div class="wkh"><span class="wkt">🏆 Van de week</span><span class="meta">afgelopen 7 dagen</span></div><div class="wkg">'+(best?'<button class="wkc" data-chip="'+best.p.id+'"><small>CHIPS</small><b>'+esc(best.p.brand+" "+best.p.flavor)+'</b><span>'+best.a.n+(best.a.n===1?' check-in':' check-ins')+' · '+best.a.avg.toFixed(1)+' ★</span></button>':'')+(top?'<div class="wkc"><small>GEBRUIKER</small><b>'+nameBtn(top.u)+'</b><span>'+top.n+(top.n===1?' check-in':' check-ins')+'</span></div>':'')+'</div></div>';
}

function zApply(res,fo){
  var f=fo||zget(),pp={},st={};
  D.posts.forEach(function(x){(pp[x.pid]=pp[x.pid]||[]).push(x)});
  if(keys(f.b).length)res=res.filter(function(p){return f.b[p.brand.toLowerCase()]});
  if(keys(f.c).length)res=res.filter(function(p){return flavCats(p).some(function(c){return f.c[c]})});
  if(keys(f.t).length)res=res.filter(function(p){return f.t[(p.type||"").toLowerCase()]});
  res.forEach(function(p){st[p.id]=aggr(pp[p.id]||[],p)});
  if(f.min>0)res=res.filter(function(p){return st[p.id].n&&st[p.id].avg>=f.min});
  if(keys(f.co).length)res=res.filter(function(p){return (pp[p.id]||[]).some(function(x){var c=plCountry(x.place).toLowerCase();return c&&f.co[c]})});
  if(f.fr)res=res.filter(function(p){return (pp[p.id]||[]).some(function(x){return x.uid!==uid&&following(x.uid)})});
  if(f.nw)res=res.filter(function(p){return !(pp[p.id]||[]).some(function(x){return x.uid===uid})});
  var s=f.sort||"new";
  return res.slice().sort(function(a,b){
    if(s==="top")return (st[b.id].n?st[b.id].avg:-1)-(st[a.id].n?st[a.id].avg:-1)||st[b.id].n-st[a.id].n;
    if(s==="most")return st[b.id].n-st[a.id].n||(b.ts-a.ts);
    if(s==="az")return (a.brand+" "+a.flavor).localeCompare(b.brand+" "+b.flavor,"nl");
    return b.ts-a.ts;
  });
}

var ofT=null;
function ofLookup(c){
  var msg=$("ofm");if(!msg||!$("fb")||!/^\d{8,14}$/.test(c))return;
  if(D.products.some(function(x){return x.code===c})){msg.textContent="";return}
  msg.textContent="Gegevens opzoeken...";
  fetch("https://world.openfoodfacts.org/api/v2/product/"+c+".json?fields=product_name,brands,quantity,product_quantity")
    .then(function(r){return r.json()})
    .then(function(j){
      var el=$("ofm");if(!el)return;
      var pr=j&&j.status===1&&j.product;
      if(!pr||!(pr.product_name||pr.brands)){el.textContent="Niet gevonden in Open Food Facts. Vul de gegevens zelf in.";return}
      var br=String(pr.brands||"").split(",")[0].trim(),nm=String(pr.product_name||"").trim();
      if(br&&nm.toLowerCase().indexOf(br.toLowerCase())===0)nm=nm.slice(br.length).replace(/^[\s\-–:]+/,"").trim();
      var g=parseFloat(pr.product_quantity);
      if(!(g>0)){var q=/([\d.,]+)\s*(kg|g)\b/i.exec(pr.quantity||"");if(q)g=parseFloat(q[1].replace(",","."))*(q[2].toLowerCase()==="kg"?1000:1)}
      function set(id,v){var e=$(id);if(e&&v&&!e.value)e.value=v}
      set("fb",br);set("ff",nm);if(g>0)set("fs",String(Math.round(g*10)/10));
      el.textContent="Gegevens opgehaald via Open Food Facts. Controleer ze even.";
    })
    .catch(function(){var el=$("ofm");if(el)el.textContent="Opzoeken lukt nu niet. Vul de gegevens zelf in."});
}

function wrYear(){var d=new Date();return d.getMonth()===11?d.getFullYear():d.getFullYear()-1}
function wrData(u,y){
  var ps=D.posts.filter(function(p){return p.uid===u&&new Date(p.ts).getFullYear()===y});
  if(!ps.length)return null;

  var brands=keys(bm).map(function(k){var b=bm[k];return{n:b.n,c:b.c,avg:b.s/b.c}}).sort(function(a,b){return b.c-a.c||b.avg-a.avg});

function suggestions(){

  D.follows.forEach(function(f){

  keys(cnt).forEach(function(u){if(folMe[u]||!PM[u])return;out.push({u:u,why:cnt[u]+(cnt[u]===1?" vriend gemeen":" vrienden gemeen"),s:cnt[u]})});

  if(st==="login")return h+'<div class="gbox"><div class="name">Inloggen</div>'+lg+'<input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord">'+m+'<button class="gb pri" data-g="dologin">Inloggen</button><button class="gl" data-g="forgot">Wachtwoord vergeten?</button><button class="gb" data-g="gback">Terug</button></div>';

  if(st==="reset")return h+'<div class="gbox"><div class="name">Nieuw wachtwoord kiezen</div><input id="pw" type="password" autocomplete="new-password" placeholder="Nieuw wachtwoord (minstens 8 tekens)" aria-label="Nieuw wachtwoord"><input id="pw2" type="password" autocomplete="new-password" placeholder="Herhaal nieuw wachtwoord" aria-label="Herhaal nieuw wachtwoord">'+m+'<button class="gb pri" data-g="doreset">Wachtwoord opslaan</button></div>';
  var RF=S.rf||{};
  if(st==="terms")return h+'<div class="gbox" style="max-width:420px"><div class="pvbox">'+termsHtml()+'</div><button class="gb pri" data-g="privback">Terug</button></div>';
  if(st==="privacy")return h+'<div class="gbox" style="max-width:420px"><div class="pvbox">'+privacyHtml()+'</div><button class="gb pri" data-g="privback">Terug</button></div>';
  if(st==="register")return h+'<div class="gbox"><div class="name">Account aanmaken</div><input id="un" maxlength="24" autocomplete="off" autocapitalize="none" placeholder="Gebruikersnaam" aria-label="Gebruikersnaam" value="'+esc(RF.un||"")+'">'+em.replace("<input ",'<input value="'+esc(RF.em||"")+'" ')+'<input id="pw" type="password" autocomplete="new-password" placeholder="Wachtwoord (minstens 8 tekens)" aria-label="Wachtwoord">'+ctBox(CT.code)+'<label class="ck"><input type="checkbox" id="agree"'+(RF.agree?" checked":"")+'><span>Ik ben 16 jaar of ouder en ga akkoord met de <button type="button" class="gl" data-g="terms" style="display:inline;width:auto;padding:0;text-decoration:underline">gebruiksvoorwaarden</button> en de <button type="button" class="gl" data-g="priv" style="display:inline;width:auto;padding:0;text-decoration:underline">privacyverklaring</button></span></label>'+m+'<button class="gb pri" data-g="mk">Account aanmaken</button><button class="gb" data-g="gback">Terug</button></div>';

function copyHtml(){var h=(typeof COPYRIGHT_HOLDER==="string"&&COPYRIGHT_HOLDER.trim())?COPYRIGHT_HOLDER.trim():"";return '<p class="cpr">© '+new Date().getFullYear()+' Chipstrack'+(h?' · '+esc(h):'')+'. Alle rechten voorbehouden.</p>'}
function showGate(){var g=$("gate");if(S.gate==="app"){g.style.display="none";g.innerHTML="";pushSync();setTimeout(tryPend,400);return}g.style.display="flex";g.innerHTML=gateHtml()+copyHtml()}
async function authFn(body){
  try{var res=await fetch(SUPABASE_URL+"/functions/v1/login",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY},body:JSON.stringify(body)});
    var j={};try{j=await res.json()}catch(e){}
    if(j&&(j.session||j.ok))return j;
    return {error:(j&&j.error)||(res.status===429?"rate":"net")}}
  catch(e){return {error:"net"}}
}
async function authAct(a){
  S.gmsg="";
  try{
    if(a==="toauth"||a==="gback"){closeModal();S.gate="auth"}
    else if(a==="login")S.gate="login";
    else if(a==="create"){CT.code="";S.rf={};S.gate="register"}
    else if(a==="priv"){S.rf={un:val("un"),em:val("em"),agree:$("agree").checked};S.pback=S.gate;S.gate="privacy"}
    else if(a==="terms"){S.rf={un:val("un"),em:val("em"),agree:$("agree").checked};S.pback=S.gate;S.gate="terms"}
    else if(a==="privback"){S.gate=S.pback||"auth"}
    else if(a==="guest")S.gate="app";
    else if(a==="forgot")S.gate="forgot";
    else if(a==="doforgot"){
      var id2=val("em").trim();
      if(!id2)S.gmsg="Vul je gebruikersnaam of e-mailadres in.";
      else{
        var rr=await authFn({action:"reset",identifier:id2,redirectTo:location.origin+location.pathname});
        if(rr.error){S.gmsg=rr.error==="rate"?"Wacht even en probeer het over een minuut opnieuw.":"De e-mail kon niet worden verstuurd. Probeer het later opnieuw of mail naar info@chipstrack.nl.";showGate();render();return}
        S.gate="login";S.gmsg="Als dit account bestaat, hebben we een e-mail gestuurd met een link om je wachtwoord te wijzigen."
      }
    }
    else if(a==="doreset"){
      if(val("pw").length<8)S.gmsg="Kies een wachtwoord van minstens 8 tekens.";
      else if(val("pw")!==val("pw2"))S.gmsg="De twee wachtwoorden zijn niet gelijk.";
      else{
        var ur=await SB.auth.updateUser({password:val("pw")});
        if(ur.error)S.gmsg=/same|different/i.test(ur.error.message||"")?"Kies een ander wachtwoord dan je huidige.":"Wijzigen mislukt: "+ur.error.message;
        else{RECOV=false;var ss=(await SB.auth.getSession()).data.session;if(ss){uid=ss.user.id;idok=true;await loadAll();S.gate="app";toast("Wachtwoord gewijzigd")}else{S.gate="login";S.gmsg="Wachtwoord gewijzigd. Log nu in."}}
      }
    }
    else if(a==="logout"){try{await pushOff()}catch(e){}PSY="";await SB.auth.signOut();idok=false;uid="lokaal";S.gate="auth";S.tab="feed";S.det=null}
    else if(a==="dologin"){
      var ident=val("em").trim();
      var r=ident&&val("pw")?await authFn({action:"login",identifier:ident,password:val("pw")}):{error:"invalid"};
      if(!r.error&&r.session){var sr=await SB.auth.setSession({access_token:r.session.access_token,refresh_token:r.session.refresh_token});if(sr.error||!sr.data.user)r={error:"invalid"};else r={user:sr.data.user}}
      if(r.error)S.gmsg=r.error==="confirm"?"Bevestig eerst je e-mailadres via de mail die we je stuurden.":r.error==="rate"?"Te veel pogingen. Wacht even en probeer het over een minuut opnieuw.":"Gebruikersnaam, e-mailadres of wachtwoord klopt niet.";
      else{uid=r.user.id;idok=true;await loadAll();S.gate="app"}
    }else if(a==="mk"){
      var n=val("un").trim();S.rf={un:val("un"),em:val("em"),agree:$("agree").checked};
      if(n.length<3||!/^[A-Za-z0-9_.-]+$/.test(n)||n.length>24)S.gmsg="Gebruikersnaam: 3 tot 24 tekens, letters, cijfers, _ . of -";
      else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("em").trim()))S.gmsg="Vul een geldig e-mailadres in.";
      else if(val("pw").length<8)S.gmsg="Kies een wachtwoord van minstens 8 tekens.";
      else if(!(CT.code||ctExact(val("cty"))))S.gmsg="Kies je land uit de lijst.";
      else if(!$("agree").checked)S.gmsg="Bevestig dat je 16 jaar of ouder bent en akkoord gaat met de gebruiksvoorwaarden en de privacyverklaring.";
      else if(D.profiles.some(function(q){return q.username.toLowerCase()===n.toLowerCase()}))S.gmsg="Deze gebruikersnaam is al bezet.";
      else{
        var r2=await SB.auth.signUp({email:val("em").trim(),password:val("pw"),options:{data:{username:n,country:CT.code||ctExact(val("cty"))}}});
        if(r2.error){var m2=r2.error.message||"";S.gmsg=/already|registered/i.test(m2)?"Dit e-mailadres is al in gebruik. Log in of kies een ander adres.":/database/i.test(m2)?"Deze gebruikersnaam is al bezet.":"Account maken mislukt: "+m2}
        else if(r2.data.user&&r2.data.user.identities&&!r2.data.user.identities.length)S.gmsg="Dit e-mailadres is al in gebruik. Log in of kies een ander adres.";
        else if(!r2.data.session){S.gate="login";S.gmsg="Account gemaakt. Bevestig eerst je e-mail en log daarna in."}
        else{S.rf={};uid=r2.data.user.id;idok=true;await loadAll();S.gate="app"}
      }
    }
  }catch(e){S.gmsg="Er ging iets mis. Probeer het opnieuw."}
  showGate();render();
}
function boot(){
  if(!ready)return;
  var el=Date.now()-T0;
  if(el<1800||(!loaded&&!CFG_MISSING&&el<4500)){setTimeout(boot,150);return}
  setAcct();S.gate=RECOV?"reset":acct?"app":"auth";if(RECOV&&!acct){S.gate="auth";RECOV=false;S.gmsg="De link is verlopen. Vraag via Inloggen > Wachtwoord vergeten een nieuwe aan.";S.gate="login"}showGate();render();
}
